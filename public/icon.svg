<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep AMOLED background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="50%" stop-color="#141829" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- Note 10 Signature Aura Glow iridescent gradient -->
    <linearGradient id="auraGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="25%" stop-color="#ff9933" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="75%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff00a0" />
    </linearGradient>

    <!-- S-Pen metallic gradient -->
    <linearGradient id="spenBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="40%" stop-color="#1a202c" />
      <stop offset="70%" stop-color="#2b6cb0" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Chrome accent -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0aec0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00f0ff" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base for launcher icon -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Aura Glow Dynamic Swirl Arc -->
  <path d="M 120 370 C 140 220, 240 120, 390 130 C 340 230, 260 270, 190 350 C 160 380, 130 385, 120 370 Z" 
        fill="url(#auraGlow)" opacity="0.35" filter="url(#glow)" />
  
  <path d="M 130 360 C 150 240, 230 150, 360 160 C 310 240, 250 280, 190 340 Z" 
        fill="url(#auraGlow)" opacity="0.85" />

  <!-- Galaxy Note 10 Infinity-O camera punch hole nod -->
  <circle cx="256" cy="74" r="11" fill="#000000" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <circle cx="254" cy="72" r="3" fill="#1e3a8a" opacity="0.8" />

  <!-- Iconic S-Pen stylized angle -->
  <g transform="rotate(38 270 270)">
    <!-- Pen Clicker / Top Button -->
    <rect x="264" y="70" width="16" height="24" rx="4" fill="url(#chrome)" />
    <!-- Pen Cap ring -->
    <rect x="261" y="94" width="22" height="8" rx="2" fill="#ff007f" />
    <!-- Pen Shaft -->
    <rect x="262" y="102" width="20" height="230" rx="6" fill="url(#spenBody)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <!-- Air Action Bluetooth Gesture Button -->
    <rect x="267" y="160" width="10" height="28" rx="3" fill="#00f0ff" opacity="0.9" />
    <!-- Pen Tip Cone -->
    <polygon points="262,332 282,332 272,366" fill="#1a202c" />
    <!-- Fine Nib -->
    <circle cx="272" cy="368" r="3" fill="#00f0ff" filter="url(#glow)" />
  </g>

  <!-- Electric Sparkle / Pen Trail -->
  <circle cx="340" cy="380" r="5" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="370" cy="355" r="3.5" fill="#ff00a0" filter="url(#glow)" />
  <circle cx="395" cy="385" r="2.5" fill="#ffdd00" />
  
  <!-- "10" subtle watermark engraving -->
  <text x="385" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="rgba(255,255,255,0.18)" letter-spacing="2">NOTE 10</text>
</svg>
